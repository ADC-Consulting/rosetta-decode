services:
  postgres:
    build:
      context: ./config/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=rosetta
    environment:
      POSTGRES_DB: rosetta
      POSTGRES_USER: rosetta
      POSTGRES_PASSWORD: rosetta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - rosetta-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosetta -d rosetta"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://rosetta:rosetta@postgres:5432/rosetta
      - UPLOAD_DIR=/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rosetta-net
    volumes:
      - uploads:/uploads

  tensorzero:
    image: tensorzero/gateway@sha256:4dfc5fffccbae7c39da85505c4449d7551afe14e19a9fd17fc0473f547f371c1
    container_name: rosetta-tensorzero
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      TENSORZERO_POSTGRES_URL: postgres://rosetta:rosetta@postgres:5432/rosetta
      TENSORZERO_GATEWAY_BIND_ADDRESS: 0.0.0.0:3000
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-}
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
      AZURE_ANTHROPIC_ENDPOINT: ${AZURE_ANTHROPIC_ENDPOINT:-https://ash-pls-ai-dev2.cognitiveservices.azure.com/anthropic/v1/}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        : "$${AZURE_AI_FOUNDRY_ENDPOINT:?set AZURE_AI_FOUNDRY_ENDPOINT in .env}"
        cp /app/config/tensorzero.toml /tmp/tensorzero.toml
        sed -i "s|\$${AZURE_AI_FOUNDRY_ENDPOINT}|$${AZURE_AI_FOUNDRY_ENDPOINT}|g" /tmp/tensorzero.toml
        sed -i "s|\$${AZURE_ANTHROPIC_ENDPOINT}|$${AZURE_ANTHROPIC_ENDPOINT}|g" /tmp/tensorzero.toml
        gateway --config-file /tmp/tensorzero.toml --run-postgres-migrations
        exec gateway --config-file /tmp/tensorzero.toml --log-format json
    networks:
      - rosetta-net

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://rosetta:rosetta@postgres:5432/rosetta
      - UPLOAD_DIR=/uploads
    depends_on:
      postgres:
        condition: service_healthy
      tensorzero:
        condition: service_started
    networks:
      - rosetta-net
    volumes:
      - uploads:/uploads

  executor:
    build:
      context: .
      dockerfile: src/executor/Dockerfile
    ports:
      - "8001:8001"
    networks:
      - rosetta-net
    volumes:
      - uploads:/uploads
      - uploads:/workspace/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - WORKSPACE_DATA_DIR=/workspace/data

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - rosetta-net

volumes:
  postgres_data:
  frontend_node_modules:
  uploads:

networks:
  rosetta-net:
    driver: bridge
