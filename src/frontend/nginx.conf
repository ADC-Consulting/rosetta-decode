# Browser hard-navigation to a client route that happens to share a path
# prefix with a backend API endpoint (/jobs/<id>, /explain) must still serve
# the SPA shell so React Router can take over — otherwise nginx proxies the
# navigation straight to the backend, and the browser gets raw JSON (or a
# 404/405 for a POST-only route) instead of the app ever loading. A real
# top-level navigation always sends `Accept: text/html,...`; this app's own
# fetch()/EventSource calls to these same paths never do, so this header
# reliably tells the two apart without touching any application code.
#
# `map` is an http-context-only directive — this file is included inside
# nginx's main `http {}` block as conf.d/default.conf, so it must sit here,
# outside the `server {}` block below, even though it's only used inside it.
map $http_accept $accepts_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Demo HTTP Basic Auth toggle (F97 subtask F). docker-entrypoint.sh writes
    # auth.conf here — containing `auth_basic`/`auth_basic_user_file` — only
    # when DEMO_AUTH_USER/DEMO_AUTH_PASSWORD are both set; otherwise the
    # directory is empty and this include is a no-op (nginx does not error on
    # a wildcard include matching zero files). Placed at the server level, not
    # inside individual `location` blocks, so it applies to every location
    # below (static assets and all proxied API routes) via nginx's normal
    # auth_basic inheritance — no per-location duplication, and no location
    # here sets `auth_basic off;` to opt back out.
    include /etc/nginx/conf.d/auth-enabled/*.conf;

    # Docker's embedded DNS (127.0.0.11 on every user-defined network, incl.
    # rosetta-net). Combined with the $backend variable below, this makes
    # nginx resolve "backend" lazily per-request instead of once at startup —
    # a literal `proxy_pass http://backend:8000` would otherwise crash nginx
    # with "host not found in upstream" if the backend container isn't
    # already up (and its network alias registered) the instant nginx starts.
    resolver 127.0.0.11 valid=10s;
    set $backend "http://backend:8000";

    # Static assets + SPA fallback. Client-side routes (React Router, see
    # src/frontend/src/App.tsx: /, /jobs, /jobs/:id, /jobs/:id/editor,
    # /lineage, /docs, /explain) don't exist as files on disk, so anything
    # that isn't a real asset falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API reverse proxy ────────────────────────────────────────────
    # Mirrors src/frontend/vite.config.ts's server.proxy table (added in
    # PR #135) so the built static bundle can keep calling relative paths
    # (e.g. fetch("/jobs/...")) in every environment, dev or deployed.

    location /migrate {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /explain streams SSE-formatted chunks over a plain fetch() response
    # (src/frontend/src/api/explain.ts, parseSseStream reads response.body
    # via a reader rather than EventSource). nginx buffers proxied responses
    # by default, which would hold the whole reply until the backend closes
    # the connection — defeating the stream. Buffering must stay off here.
    location /explain {
        # `last`, not `break`: this location's content handler is proxy_pass,
        # not try_files. `break` only stops further rewrite-module processing
        # — the rewritten URI still falls through to this block's own
        # proxy_pass, which would send GET/POST /index.html to the *backend*
        # (404/405) instead of serving the static file. `last` instead forces
        # nginx to re-run location matching on the rewritten URI, which lands
        # it in `location /` above and its `try_files`, actually serving
        # index.html from disk. Confirmed via curl against a running
        # container — `break` silently proxied to the backend here.
        if ($accepts_html) {
            rewrite ^ /index.html last;
        }

        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # GET /jobs/{id}/trace/stream is a real EventSource/SSE connection
    # (src/frontend/src/api/jobs.ts, openTraceStream). Same buffering fix as
    # /explain, but scoped to just this path (nginx regex locations win over
    # the plain-prefix /jobs location below) so ordinary REST calls under
    # /jobs keep normal buffered proxying.
    location ~ ^/jobs/[^/]+/trace/stream$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location /jobs {
        # `last`, not `break` — see the comment in the /explain block above:
        # this location also proxies, so `break` would still hand the
        # rewritten /index.html request to the backend instead of serving
        # the static file. `last` re-matches into `location /`'s try_files.
        if ($accepts_html) {
            rewrite ^ /index.html last;
        }

        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
