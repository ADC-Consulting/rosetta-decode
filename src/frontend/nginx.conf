server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Demo HTTP Basic Auth toggle (F97 subtask F). docker-entrypoint.sh writes
    # auth.conf here — containing `auth_basic`/`auth_basic_user_file` — only
    # when DEMO_AUTH_USER/DEMO_AUTH_PASSWORD are both set; otherwise the
    # directory is empty and this include is a no-op (nginx does not error on
    # a wildcard include matching zero files). Placed at the server level, not
    # inside individual `location` blocks, so it applies to every location
    # below (static assets and all proxied API routes) via nginx's normal
    # auth_basic inheritance — no per-location duplication, and no location
    # here sets `auth_basic off;` to opt back out.
    include /etc/nginx/conf.d/auth-enabled/*.conf;

    # Docker's embedded DNS (127.0.0.11 on every user-defined network, incl.
    # rosetta-net). Combined with the $backend variable below, this makes
    # nginx resolve "backend" lazily per-request instead of once at startup —
    # a literal `proxy_pass http://backend:8000` would otherwise crash nginx
    # with "host not found in upstream" if the backend container isn't
    # already up (and its network alias registered) the instant nginx starts.
    resolver 127.0.0.11 valid=10s;
    set $backend "http://backend:8000";

    # Static assets + SPA fallback. Client-side routes (React Router, see
    # src/frontend/src/App.tsx: /, /jobs, /jobs/:id, /jobs/:id/editor,
    # /lineage, /docs, /explain) don't exist as files on disk, so anything
    # that isn't a real asset falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API reverse proxy ────────────────────────────────────────────
    # Mirrors src/frontend/vite.config.ts's server.proxy table (added in
    # PR #135) so the built static bundle can keep calling relative paths
    # (e.g. fetch("/jobs/...")) in every environment, dev or deployed.

    location /migrate {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /explain streams SSE-formatted chunks over a plain fetch() response
    # (src/frontend/src/api/explain.ts, parseSseStream reads response.body
    # via a reader rather than EventSource). nginx buffers proxied responses
    # by default, which would hold the whole reply until the backend closes
    # the connection — defeating the stream. Buffering must stay off here.
    location /explain {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # GET /jobs/{id}/trace/stream is a real EventSource/SSE connection
    # (src/frontend/src/api/jobs.ts, openTraceStream). Same buffering fix as
    # /explain, but scoped to just this path (nginx regex locations win over
    # the plain-prefix /jobs location below) so ordinary REST calls under
    # /jobs keep normal buffered proxying.
    location ~ ^/jobs/[^/]+/trace/stream$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location /jobs {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
